<!-- them_hoadon.php -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Thêm hóa đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">
  
    <h2>Thêm hóa đơn</h2>
    <form id="formHoadon">
      <div class="mb-3">
        <label for="ma_khach_hang" class="form-label">Mã khách hàng:</label>
        <input type="text" id="ma_khach_hang" name="ma_khach_hang" class="form-control" required>
    </div>
    
    <div class="mb-3">
        <label for="ten_khach_hang" class="form-label">Tên khách hàng:</label>
        <input type="text" id="ten_khach_hang" name="ten_khach_hang" class="form-control" readonly>
    </div>
    
    <script>
        document.getElementById("ma_khach_hang").addEventListener("blur", function () {
            const maKH = this.value;
    
            if (maKH.trim() === "") return;
    
            fetch("lay_ten_khachhang.php?ma_khach_hang=" + encodeURIComponent(maKH))
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById("ten_khach_hang").value = data.ten_khach_hang;
                    } else {
                        document.getElementById("ten_khach_hang").value = "Không tìm thấy";
                    }
                })
                .catch(error => {
                    console.error("Lỗi:", error);
                    document.getElementById("ten_khach_hang").value = "Lỗi kết nối";
                });
        });
    </script>
    
        <div class="mb-3">
            <label for="ngayLap" class="form-label">Ngày lập:</label>
            <input type="date" class="form-control" id="ngayLap" name="ngayLap" required>
        </div>

        <h5>Danh sách sản phẩm</h5>
        <div id="sanPhamContainer">
            <div class="row mb-2 sanPhamItem">
                <div class="col">
                    <input type="text" class="form-control" name="maSach[]" placeholder="Mã sách" required>
                </div>
                <div class="col">
                    <input type="number" class="form-control" name="soLuong[]" placeholder="Số lượng" required>
                </div>
            </div>
        </div>
        <button type="button" class="btn btn-sm btn-secondary mb-3" onclick="addSanPham()">+ Thêm sản phẩm</button>

        <div class="mb-3">
            <label for="soTienTra" class="form-label">Số tiền trả:</label>
            <input type="number" class="form-control" id="soTienTra" name="soTienTra" required>
        </div>

        <button type="submit" class="btn btn-primary">Lưu hóa đơn</button>
        <div id="thongBao" class="mt-3"></div>
    </form>

    <script>
        function addSanPham() {
            const container = document.getElementById("sanPhamContainer");
            const row = document.createElement("div");
            row.className = "row mb-2 sanPhamItem";
            row.innerHTML = `
                <div class="col">
                    <input type="text" class="form-control" name="maSach[]" placeholder="Mã sách" required>
                </div>
                <div class="col">
                    <input type="number" class="form-control" name="soLuong[]" placeholder="Số lượng" required>
                </div>
            `;
            container.appendChild(row);
        }

        document.getElementById("formHoadon").addEventListener("submit", function(e) {
            e.preventDefault();

            const maKhachHang = document.getElementById("maKhachHang").value;
            const ngayLap = document.getElementById("ngayLap").value;
            const soTienTra = document.getElementById("soTienTra").value;

            const maSachs = document.getElementsByName("maSach[]");
            const soLuongs = document.getElementsByName("soLuong[]");

            let sanPham = [];
            for (let i = 0; i < maSachs.length; i++) {
                sanPham.push({
                    maSach: maSachs[i].value,
                    soLuong: parseInt(soLuongs[i].value)
                });
            }

            fetch("them_hoadon.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    maKhachHang,
                    ngayLap,
                    soTienTra,
                    sanPham
                })
            })
            .then(res => res.json())
            .then(data => {
                const tb = document.getElementById("thongBao");
                tb.textContent = data.message;
                tb.className = data.success ? "text-success" : "text-danger";
            });
        });
    </script>
</body>
</html>
