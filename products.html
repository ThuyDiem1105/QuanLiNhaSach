<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quản lý sản phẩm</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script defer src="products.js"></script>
</head>
<body class="bg-gray-100">
  <div class="p-6">
    <h1 class="text-2xl font-bold mb-4">Danh sách sản phẩm</h1>
    <table class="w-full table-auto border border-gray-300 bg-white rounded">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-4 py-2 border">ID</th>
          <th class="px-4 py-2 border">Tên</th>
          <th class="px-4 py-2 border">Giá</th>
          <th class="px-4 py-2 border">Tồn kho</th>
        </tr>
      </thead>
      <tbody id="productTable"></tbody>
    </table>
  </div>
</body>
</html>
