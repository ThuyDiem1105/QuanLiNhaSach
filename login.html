<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-6 rounded shadow-md w-96">
    <h1 class="text-xl font-bold mb-4 text-center">Đăng nhập</h1>
    <!-- Dùng method POST + trỏ đúng file xử lý -->
    <form action="login_process.php" method="POST">
      <label class="block mb-2">Tên đăng nhập:</label>
      <input name="username" class="w-full border px-3 py-2 mb-4" required>
      <label class="block mb-2">Mật khẩu:</label>
      <input name="password" type="password" class="w-full border px-3 py-2 mb-4" required>
      <button type="submit" class="bg-pink-500 text-white px-4 py-2 rounded w-full">Đăng nhập</button>
    </form>
  </div>
</body>
</html>
