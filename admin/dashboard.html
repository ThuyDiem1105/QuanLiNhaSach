<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../assets/dashboard-style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="dashboard-script.js" defer></script>
</head>
<body>
    <div class="main">
        <div class="cards">
            <div class="card">
                <div><img src="../assets/chart-line.png" class="icon-dashboard"/></div>
                <div class="text">
                    <p>Đơn hàng hôm nay</p>
                    <strong id="orders-today">1234</strong>
                </div>  
            </div>
            <div class="card">
                <div><img src="../assets/chart-column.png" class="icon-dashboard"/></div>
                <div class="text">
                    <p>Số sách bán ra</p>
                    <strong id="books-sold-today">1234</strong>
                </div>
            </div>
            <div class="card">
                <div><img src="../assets/circle-dollar-sign.png" class="icon-dashboard"/></div>
                <div class="text">
                    <p>Doanh thu hôm nay</p>
                    <strong id="revenue-today">10.920.222 đ</strong>
                </div>
            </div>
            <div class="card">
                <div><img src="../assets/users-round.png" class="icon-dashboard"/></div>
                <div class="text">
                    <p>Tổng số khách hàng</p>
                    <strong id="total-customers">1234</strong>
                </div>
            </div>
        </div>

        <div class="charts-wrapper">
            <div class="chart-container">
                <canvas id="chart1"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="chart2"></canvas>
            </div>
        </div>

        <div class="recent">
            <div class="table-title">
                <img src="../assets/recent-orders.png" class="icon-table"/>
                <p id="don-hang-ganday">
                    Đơn hàng gần đây
                </p>
            </div>
            <table id="recent-orders-table">
                <thead>
                    <tr>
                        <th>Thời gian</th>
                        <th>Hóa đơn</th>
                        <th>Khách hàng</th>
                        <th>Tổng tiền</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dữ liệu sẽ được JS render từ database -->
                </tbody>
            </table>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Cập nhật số liệu thống kê
            fetch('dashboard-stats.php')
                .then(res => res.json())
                .then(stats => {
                    document.getElementById('orders-today').textContent = stats.orders_today.toLocaleString('vi-VN');
                    document.getElementById('books-sold-today').textContent = stats.books_sold_today.toLocaleString('vi-VN');
                    document.getElementById('revenue-today').textContent = stats.revenue_today.toLocaleString('vi-VN') + ' đ';
                    document.getElementById('total-customers').textContent = stats.total_customers.toLocaleString('vi-VN');
                });
            fetch('dashboard-orders.php')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.querySelector("#recent-orders-table tbody");
                    tbody.innerHTML = "";
                    data.forEach(order => {
                        // Định dạng ngày giờ
                        let dateStr = order.NgayLap;
                        if (dateStr && dateStr.length >= 10) {
                            const d = new Date(dateStr);
                            if (!isNaN(d)) {
                                dateStr = d.toLocaleTimeString('vi-VN', {hour12: false}) + ' ' + d.toLocaleDateString('vi-VN');
                            }
                        }
                        tbody.innerHTML += `
                            <tr>
                                <td>${dateStr}</td>
                                <td>${order.MaHD}</td>
                                <td>${order.HoTen || ''}</td>
                                <td>${Number(order.TongTien).toLocaleString('vi-VN')} đ</td>
                            </tr>
                        `;
                    });
                });
        });
    </script>
</body>
</html>
