<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script defer src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" data-source-map="false"></script>
    
</head>
<body class="bg-gray-100">

    <div id="dashboard">
        <div class="flex">
        <!-- Sidebar -->
            <aside class="w-64 bg-white h-screen shadow-md">
                <div class="p-4 font-bold text-xl text-pink-600">Booktopia</div>
                <nav class="mt-4">
                    <a href="dashboard.html" class="block p-4 hover:bg-pink-100">Tổng quan</a>
                    <a href="products.html" class="block p-4 hover:bg-pink-100">Sản phẩm</a>
                    <a href="them_hoadon.html" class="block p-4 hover:bg-pink-100">Hóa đơn</a>
                    <a href="#" class="block p-4 hover:bg-pink-100">Khách hàng</a>
                    <a href="#" class="block p-4 hover:bg-pink-100">Nhân viên</a>
                    <a href="#" class="block p-4 hover:bg-pink-100">Phiếu nhập sản phẩm</a>
                    <a href="#" class="block p-4 hover:bg-pink-100">Khuyến mãi</a>
                    <a href="#" class="block p-4 hover:bg-pink-100">Báo cáo</a>
                    <a href="#" class="block p-4 hover:bg-pink-100">Thay đổi quy định</a>
                    <a href="#" class="block p-4 hover:bg-pink-100">Đăng xuất</a>
                </nav>
            </aside>

        <!-- Main Content -->
            <main class="flex-1 p-6">
                <h1 class="text-2xl font-bold mb-6">Trang quản trị</h1>
                <div class="grid grid-cols-2 gap-6">
                    <div class="bg-white p-4 rounded shadow">
                        <h2 class="font-semibold">Đơn hàng hôm nay</h2>
                        <p class="text-3xl">1234</p>
                    </div>
                    <div class="bg-white p-4 rounded shadow">
                        <h2 class="font-semibold">Tổng đơn hàng</h2>
                        <p class="text-3xl">1234</p>
                    </div>
                </div>
                <div class="mt-10 bg-white p-4 rounded shadow">
                    <h2 class="font-semibold mb-4">Top 3 sản phẩm bán chạy</h2>
                    <canvas id="salesChart" height="100"></canvas>
                </div>
                <div class="mt-10 bg-white p-4 rounded shadow">
                    <h2 class="font-semibold mb-4">Đơn hàng gần đây</h2>
                    <table class="w-full table-auto border border-gray-200">
                      <thead class="bg-gray-100">
                        <tr>
                          <th class="px-4 py-2 border">Ngày</th>
                          <th class="px-4 py-2 border">Mã đơn</th>
                          <th class="px-4 py-2 border">Khách hàng</th>
                          <th class="px-4 py-2 border">Trạng thái</th>
                        </tr>
                      </thead>
                      <tbody id="orderTable">
                        <!-- Dữ liệu sẽ được thêm bằng JS -->
                      </tbody>
                    </table>
                  </div>                  
            </main>
        </div>
    </div>

</body>
</html>
