<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý hóa đơn</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
    i[data-lucide] { width: 18px; height: 18px; color: inherit; }

    .main-content { padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .search-filter { display: flex; gap: 10px; }
    .search-filter input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .add-button {
      background-color: #81c784;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .add-button:hover { background-color: #66bb6a; }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 6px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #81c784;
      color: white;
    }
    .action-buttons button {
      margin-right: 5px;
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .view-btn { background-color: #64b5f6; color: white; }
    .edit-btn { background-color: #ffb74d; color: white; }
    .delete-btn { background-color: #e57373; color: white; }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .form-popup {
      background: #fff;
      padding: 32px 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      position: relative;
      border: 1px solid #81c784;
    }

    .form-popup::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 6px;
      width: 100%;
      background-color: #81c784;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    .form-popup h3 {
      margin-top: 0;
      margin-bottom: 24px;
      color: #2c3e50;
      text-align: center;
      font-size: 22px;
    }

    .form-popup label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      color: #444;
      font-size: 14px;
    }

    .form-popup input {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .form-popup input:focus {
      border-color: #81c784;
      outline: none;
      box-shadow: 0 0 6px rgba(129, 199, 132, 0.3);
    }

    .form-popup input[readonly] {
      background-color: #f4f4f4;
      border-color: #ddd;
      color: #666;
      cursor: not-allowed;
    }

    .form-buttons {
      display: flex;
      justify-content: flex-end;
      margin-top: 28px;
      gap: 12px;
    }

    .btn-save, .btn-cancel, .btn-edit {
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-save { background-color: #81c784; color: white; }
    .btn-cancel { background-color: #e57373; color: white; }
    .btn-edit { background-color: #ffb74d; color: white; }

    .btn-save:hover { background-color: #66bb6a; }
    .btn-cancel:hover { background-color: #ef5350; }
    .btn-edit:hover { background-color: #ffa726; }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="header">
      <div class="search-filter">
        <input type="text" placeholder="Tìm mã hóa đơn...">
      </div>
      <button class="add-button" onclick="createNewOrder()">+ Thêm hóa đơn</button>
    </div>
    <table id="orderTable">
      <thead>
        <tr>
          <th>Mã HĐ</th>
          <th>Mã KH</th>
          <th>Ngày lập</th>
          <th>Tổng tiền</th>
          <th>Đã thanh toán</th>
          <th>Còn lại</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>HD001</td>
          <td>KH001</td>
          <td>2024-05-01</td>
          <td>50000</td>
          <td>30000</td>
          <td>20000</td>
          <td class="action-buttons">
            <button class="view-btn" onclick="openForm('HD001','KH001','2024-05-01','50000','30000','20000')">Xem</button>
            <button class="delete-btn" onclick="deleteRow(this)">Xóa</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div id="orderFormOverlay" class="overlay">
    <div class="form-popup">
      <h3>Thông tin hóa đơn</h3>
      <form id="orderForm" onsubmit="return false;">
        <label>Mã HĐ:</label><input type="text" name="ma_hd" readonly>
        <label>Mã KH:</label><input type="text" name="ma_kh" required>
        <label>Ngày lập:</label><input type="date" name="ngay_lap" required>
        <label>Tổng tiền:</label><input type="number" name="tong_tien" required>
        <label>Đã thanh toán:</label><input type="number" name="da_thanh_toan" required>
        <label>Còn lại:</label><input type="number" name="con_lai" required>
        <div class="form-buttons">
          <button type="button" class="btn-save" onclick="saveOrder()" style="display: none;">Lưu</button>
          <button type="button" class="btn-edit" onclick="enableEditing()">Sửa</button>
          <button type="button" class="btn-cancel" onclick="closeForm()">Đóng</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let editingIndex = -1;

    function openForm(maHD, maKH, ngayLap, tongTien, daThanhToan, conLai) {
      const form = document.forms['orderForm'];
      form.ma_hd.value = maHD;
      form.ma_kh.value = maKH;
      form.ngay_lap.value = ngayLap;
      form.tong_tien.value = tongTien;
      form.da_thanh_toan.value = daThanhToan;
      form.con_lai.value = conLai;

      editingIndex = Array.from(document.querySelector('#orderTable tbody').rows)
        .findIndex(row => row.cells[0].textContent === maHD);

      for (let input of form.elements) {
        input.readOnly = true;
      }

      document.querySelector(".btn-save").style.display = "none";
      document.querySelector(".btn-edit").style.display = "inline-block";

      document.getElementById("orderFormOverlay").classList.add("show");
    }

    function enableEditing() {
      const form = document.forms['orderForm'];
      for (let input of form.elements) {
        if (input.name !== "ma_hd") {
          input.readOnly = false;
        }
      }
      document.querySelector(".btn-save").style.display = "inline-block";
      document.querySelector(".btn-edit").style.display = "none";
    }

    function createNewOrder() {
      const form = document.forms['orderForm'];
      const table = document.getElementById("orderTable").getElementsByTagName("tbody")[0];
      const nextId = "HD" + String(table.rows.length + 1).padStart(3, '0');

      form.reset();
      form.ma_hd.value = nextId;

      for (let input of form.elements) {
        input.readOnly = false;
      }

      document.querySelector(".btn-save").style.display = "inline-block";
      document.querySelector(".btn-edit").style.display = "none";

      editingIndex = -1;
      document.getElementById("orderFormOverlay").classList.add("show");
    }

    function saveOrder() {
      const form = document.forms['orderForm'];
      const table = document.getElementById("orderTable").getElementsByTagName("tbody")[0];

      const maHD = form.ma_hd.value;
      const maKH = form.ma_kh.value;
      const ngayLap = form.ngay_lap.value;
      const tongTien = form.tong_tien.value;
      const daThanhToan = form.da_thanh_toan.value;
      const conLai = form.con_lai.value;

      if (editingIndex >= 0) {
        const row = table.rows[editingIndex];
        row.cells[0].textContent = maHD;
        row.cells[1].textContent = maKH;
        row.cells[2].textContent = ngayLap;
        row.cells[3].textContent = tongTien;
        row.cells[4].textContent = daThanhToan;
        row.cells[5].textContent = conLai;
      } else {
        const row = table.insertRow();
        row.innerHTML = `
          <td>${maHD}</td>
          <td>${maKH}</td>
          <td>${ngayLap}</td>
          <td>${tongTien}</td>
          <td>${daThanhToan}</td>
          <td>${conLai}</td>
          <td class="action-buttons">
            <button class="view-btn" onclick="openForm('${maHD}', '${maKH}', '${ngayLap}', '${tongTien}', '${daThanhToan}', '${conLai}')">Xem</button>
            <button class="delete-btn" onclick="deleteRow(this)">Xóa</button>
          </td>
        `;
      }

      closeForm();
    }

    function deleteRow(button) {
      if (confirm("Bạn có chắc muốn xóa hóa đơn này không?")) {
        const row = button.closest("tr");
        row.remove();
      }
    }

    function closeForm() {
      document.getElementById("orderFormOverlay").classList.remove("show");
    }

    lucide.createIcons();
  </script>
</body>
</html>
