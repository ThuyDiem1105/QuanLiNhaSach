<section>
    <h2>Quản lý Sách</h2>
    <table class="product-table">
      <thead>
        <tr>
          <th>Mã SP</th>
          <th>Tên SP</th>
          <th>Danh mục</th>
          <th>Giá</th>
          <th>Kho</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>SP001</td>
          <td>Sách Kỹ Năng</td>
          <td>Phát triển bản thân</td>
          <td>120.000đ</td>
          <td>45</td>
          <td><span class="edit">Sửa</span> <span class="delete">Xóa</span></td>
        </tr>
      </tbody>
    </table>
  </section>
  
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý sách</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #f9fff6, #edfaf9, #d8ddd3);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }


    .main-content {
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .search-filter {
      display: flex;
      gap: 10px;
    }

    .search-filter input {
      font-family: fontweb;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      transition: all 0.25s ease;
    }

    .search-filter input:hover {
      border-color: #81c784;
      background-color: #f0fff4;
      box-shadow: 0 0 8px rgba(129, 199, 132, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 6px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #c8ffe5;
      color: #0d3c6b;
    }

    tbody tr {
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    tbody tr:hover {
      transform: scale(1.01);
      background-color: #e8f5e9;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      cursor: pointer;
    }

    .view-btn {
      background-color: #64b5f6;
      color: white;
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: fontweb;
      transition: all 0.2s ease;
    }

    .view-btn:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(6px);
    }

    .overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .form-popup {
      background: #fff;
      padding: 32px 24px;
      max-width: 500px;
      width: 100%;
      border-radius: 16px;
      border: 1px solid #81c784;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      transform: translateY(-20px) scale(0.98);
      opacity: 0;
      transition: all 0.4s ease;
    }

    .overlay.show .form-popup {
      transform: scale(1);
      opacity: 1;
    }

    .form-popup::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 6px;
      width: 100%;
      background-color: #81c784;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    .form-popup h3 {
      margin-bottom: 24px;
      color: #2c3e50;
      text-align: center;
      font-size: 22px;
    }

    .form-popup label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      color: #444;
      font-size: 14px;
    }

    .form-popup input {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .form-popup input[readonly] {
      background-color: #f4f4f4;
      border-color: #ddd;
      color: #666;
      cursor: not-allowed;
    }

    .form-buttons {
      display: flex;
      justify-content: flex-end;
      margin-top: 28px;
    }

    .btn-close {
      padding: 10px 20px;
      font-family: fontweb;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      background-color: #e57373;
      color: white;
      transition: all 0.2s ease;
    }

    .btn-close:hover {
      background-color: #ef5350;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="header">
      <div class="search-filter">
        <input type="text" placeholder="Tìm mã sách...">
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Mã sách</th>
          <th>Mã đầu sách</th>
          <th>NXB</th>
          <th>Năm XB</th>
          <th>Tồn</th>
          <th>Giá nhập</th>
          <th>Giá bán</th>
          <th>Chi tiết</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>S001</td>
          <td>DS001</td>
          <td>NXB Kim Đồng</td>
          <td>2023</td>
          <td>50</td>
          <td>15000</td>
          <td>20000</td>
          <td>
            <button class="view-btn" onclick="openBookForm('S001','DS001','NXB Kim Đồng',2023,50,15000,20000)">
              Xem
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div id="bookFormOverlay" class="overlay">
    <div class="form-popup">
      <h3>Chi tiết sách</h3>
      <form onsubmit="return false;">
        <label>Mã sách:</label>
        <input type="text" readonly>
        
        <label>Mã đầu sách:</label>
        <input type="text" readonly>
        
        <label>Nhà xuất bản:</label>
        <input type="text" readonly>
        
        <label>Năm xuất bản:</label>
        <input type="number" readonly>
        
        <label>Số lượng tồn:</label>
        <input type="number" readonly>
        
        <label>Đơn giá nhập:</label>
        <input type="number" readonly>
        
        <label>Đơn giá bán:</label>
        <input type="number" readonly>
        
        <div class="form-buttons">
          <button type="button" class="btn-close" onclick="closeBookForm()">Đóng</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function openBookForm(ma, dau, nxb, nam, ton, giaNhap, giaBan) {
      const form = document.forms[0];
      form[0].value = ma;
      form[1].value = dau;
      form[2].value = nxb;
      form[3].value = nam;
      form[4].value = ton;
      form[5].value = giaNhap;
      form[6].value = giaBan;
      document.getElementById("bookFormOverlay").classList.add("show");
    }

    function closeBookForm() {
      document.getElementById("bookFormOverlay").classList.remove("show");
    }
  </script>
</body>
</html>
