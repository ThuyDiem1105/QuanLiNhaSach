<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập Quản trị</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold text-center text-pink-600 mb-6">Đăng nhập Quản trị</h2>

    <form action="login.php" method="POST">
      <div class="mb-4">
        <label class="block text-gray-700 mb-2" for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" required
               class="w-full p-2 border rounded focus:outline-none focus:ring focus:border-pink-300">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 mb-2" for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required
               class="w-full p-2 border rounded focus:outline-none focus:ring focus:border-pink-300">
      </div>
      <button type="submit"
              class="w-full bg-pink-600 text-white p-2 rounded hover:bg-pink-700 transition duration-200">
        Đăng nhập
      </button>
    </form>
  </div>

</body>
</html>
