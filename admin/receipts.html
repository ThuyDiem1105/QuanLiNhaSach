<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý phiếu nhập</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }

    i[data-lucide] {
      width: 18px;
      height: 18px;
      color: inherit;
    }

    .main-content {
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .search-filter {
      display: flex;
      gap: 10px;
    }

    .search-filter input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .add-button {
      background-color: #81c784;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .add-button:hover {
      background-color: #66bb6a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 6px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #81c784;
      color: white;
    }

    .action-buttons button {
      margin-right: 5px;
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .view-btn {
      background-color: #64b5f6;
      color: white;
    }

    .edit-btn {
      background-color: #ffb74d;
      color: white;
    }

    .delete-btn {
      background-color: #e57373;
      color: white;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .form-popup {
      background: #fff;
      padding: 32px 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      position: relative;
      border: 1px solid #81c784;
    }

    .form-popup::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 6px;
      width: 100%;
      background-color: #81c784;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    .form-popup h3 {
      margin-top: 0;
      margin-bottom: 24px;
      color: #2c3e50;
      text-align: center;
      font-size: 22px;
    }

    .form-popup label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      color: #444;
      font-size: 14px;
    }

    .form-popup input {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .form-popup input:focus {
      border-color: #81c784;
      outline: none;
      box-shadow: 0 0 6px rgba(129, 199, 132, 0.3);
    }

    .form-popup input[readonly] {
      background-color: #f4f4f4;
      border-color: #ddd;
      color: #666;
      cursor: not-allowed;
    }

    .form-buttons {
      display: flex;
      justify-content: flex-end;
      margin-top: 28px;
      gap: 12px;
    }

    .btn-save, .btn-cancel, .btn-edit {
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-save {
      background-color: #81c784;
      color: white;
    }

    .btn-cancel {
      background-color: #e57373;
      color: white;
    }

    .btn-edit {
      background-color: #ffb74d;
      color: white;
    }

    .btn-save:hover {
      background-color: #66bb6a;
    }

    .btn-cancel:hover {
      background-color: #ef5350;
    }

    .btn-edit:hover {
      background-color: #ffa726;
    }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="header">
      <div class="search-filter">
        <input type="text" placeholder="Tìm mã phiếu...">
        <input type="date" placeholder="Ngày nhập...">
      </div>
      <button class="add-button" onclick="createNewReceipt()">+ Thêm phiếu nhập</button>
    </div>
    <table id="receiptTable">
      <thead>
        <tr>
          <th>Mã phiếu</th>
          <th>Ngày nhập</th>
          <th>Tổng tiền</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>PN001</td>
          <td>2024-05-01</td>
          <td>120000</td>
          <td class="action-buttons">
            <button class="view-btn" onclick="openForm('PN001', 'S001', 10, 12000)">Xem</button>
            <button class="delete-btn" onclick="deleteRow(this)">Xóa</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div id="receiptFormOverlay" class="overlay">
    <div class="form-popup">
      <h3>Chi tiết phiếu nhập</h3>
      <form id="receiptForm" onsubmit="return false;">
        <label>Mã phiếu:</label><input type="text" name="ma_phieu" required readonly>
        <label>Mã sách:</label><input type="text" name="ma_sach" required>
        <label>Số lượng:</label><input type="number" name="so_luong" required>
        <label>Đơn giá nhập:</label><input type="number" name="don_gia" required>
        <label>Thành tiền:</label><input type="number" name="thanh_tien" readonly>
        <div class="form-buttons">
          <button type="button" class="btn-edit" id="btnEdit" onclick="enableEdit()">Sửa</button>
          <button type="button" class="btn-save" id="btnSave" onclick="saveReceipt()" style="display:none;">Lưu</button>
          <button type="button" class="btn-cancel" onclick="closeForm()">Đóng</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let editingIndex = -1;

    function openForm(maPhieu, maSach, soLuong, donGia, index = -1) {
  const form = document.forms.receiptForm;
  form.ma_phieu.value = maPhieu;
  form.ma_sach.value = maSach;
  form.so_luong.value = soLuong;
  form.don_gia.value = donGia;
  form.thanh_tien.value = soLuong * donGia;

  editingIndex = index;

  toggleReadonly(true);
  document.getElementById("btnSave").style.display = "none";
  document.getElementById("btnEdit").style.display = "inline-block";

  document.getElementById("receiptFormOverlay").classList.add("show");
}


    function enableEdit() {
      toggleReadonly(false);
      document.getElementById("btnSave").style.display = "inline-block";
      document.getElementById("btnEdit").style.display = "none";
    }

    function toggleReadonly(state) {
      const form = document.forms.receiptForm;
      form.ma_phieu.readOnly = true; // luôn readonly
      form.ma_sach.readOnly = state;
      form.so_luong.readOnly = state;
      form.don_gia.readOnly = state;
    }

    function createNewReceipt() {
      const form = document.forms.receiptForm;
      const table = document.getElementById("receiptTable");
      const nextId = "PN" + String(table.rows.length).padStart(3, '0');

      form.reset();
      form.ma_phieu.value = nextId;
      form.thanh_tien.value = 0;

      toggleReadonly(false);
      document.getElementById("btnSave").style.display = "inline-block";
      document.getElementById("btnEdit").style.display = "none";

      document.getElementById("receiptFormOverlay").classList.add("show");
      editingIndex = -1;
    }

    function saveReceipt() {
  const form = document.forms.receiptForm;
  const table = document.getElementById("receiptTable").getElementsByTagName("tbody")[0];
  const maPhieu = form.ma_phieu.value;
  const ngayNhap = new Date().toISOString().split('T')[0];
  const soLuong = Number(form.so_luong.value);
  const donGia = Number(form.don_gia.value);
  const thanhTien = soLuong * donGia;

  form.thanh_tien.value = thanhTien;

  if (editingIndex !== -1) {
    const row = table.rows[editingIndex];
    row.cells[0].innerText = maPhieu;
    row.cells[1].innerText = ngayNhap;
    row.cells[2].innerText = thanhTien;
    row.cells[3].innerHTML = `
      <button class="view-btn" onclick="openForm('${maPhieu}', '${form.ma_sach.value}', ${soLuong}, ${donGia}, ${editingIndex})">Xem</button>
      <button class="delete-btn" onclick="deleteRow(this)">Xóa</button>
    `;
  } else {
    const row = table.insertRow();
    const index = row.rowIndex - 1; // bỏ phần thead
    row.innerHTML = `
      <td>${maPhieu}</td>
      <td>${ngayNhap}</td>
      <td>${thanhTien}</td>
      <td class="action-buttons">
        <button class="view-btn" onclick="openForm('${maPhieu}', '${form.ma_sach.value}', ${soLuong}, ${donGia}, ${index})">Xem</button>
        <button class="delete-btn" onclick="deleteRow(this)">Xóa</button>
      </td>
    `;
  }

  closeForm();
}


    function deleteRow(button) {
  const row = button.closest("tr");
  const index = row.rowIndex - 1;
  if (confirm("Bạn có chắc muốn xóa phiếu nhập này không?")) {
    row.remove();
    if (editingIndex === index) {
      editingIndex = -1;
    }
  }
}


    function closeForm() {
      document.getElementById("receiptFormOverlay").classList.remove("show");
    }

    lucide.createIcons();
  </script>
</body>
</html>
